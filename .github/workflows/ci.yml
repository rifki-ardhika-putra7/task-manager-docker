name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil/checkout kode dari repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # 3. Install dependencies & jalankan test
      - name: Run Backend Tests
        run: |
          cd backend
          npm install
          npm test

      # 4. Build Docker image Backend
      - name: Build Backend Docker Image
        run: docker build -t task-manager-backend:latest ./backend

      # 5. Build Docker image Frontend
      - name: Build Frontend Docker Image
        run: docker build -t task-manager-frontend:latest ./frontend
